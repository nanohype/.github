# pnpm settings live here, not in package.json.
#
# pnpm 11 stopped reading the `pnpm` field in package.json entirely, and it does
# so without failing — it prints "The following keys were ignored" and installs
# anyway. An override block left behind in package.json therefore stops applying
# the moment the package manager is bumped, and the tree relocks onto whatever
# resolves naturally. pnpm 10 already reads this file, so the settings live in
# one place across both.
#
# That is not hypothetical here. The pnpm 10 → 11 bump proposed against this
# package relocked lodash-es 4.18.1 → 4.17.21 and reintroduced nanoid 3.3.3 and
# 4.0.2 — four of the advisories below, one of them high — and every check
# passed, because nothing in this repository scans the atlas lockfile.
#
# Both packages arrive transitively; neither is a direct dependency, which is why
# they are overrides rather than entries in package.json.

overrides:
  # GHSA-r5fr-rjxr-66jc (high), GHSA-f23m-r3pf-42rh, GHSA-xxjr-mmjv-4gpg.
  # Reaches this tree through chevrotain.
  lodash-es: "^4.18.0"

  # GHSA-mwcw-c2x4-8c55. The advisory covers two disjoint ranges — <3.3.8 and
  # >=4.0.0 <5.0.9 — so a single floor cannot express it. Only the 5.x line is
  # present here, and this pins that line; the correctness of the pin depends on
  # no 3.x or 4.x copy entering the tree, which is exactly what the failed bump
  # did. If one ever does, it needs its own scoped override (`nanoid@3`), not a
  # wider floor.
  nanoid: "^5.0.9"

  # GHSA-2v8p-3f2j-5mp7, GHSA-3rrr-jr9j-h3q3 (6.5), GHSA-6x64-9x62-f2gx,
  # GHSA-rhh3-jpg6-66xh, GHSA-c4c3-pg64-4m4v. Reaches this tree through
  # @excalidraw/mermaid-to-excalidraw, which asks for ^11.12.1 — so this floor
  # sits inside the range the parent already accepts.
  mermaid: "^11.16.1"

  # GHSA-55q2-fjhq-7xh7. Arrives under mermaid, which asks for ^3.3.3 and is
  # therefore satisfied by 3.4.12 — bumping mermaid alone does not move it, so
  # it needs a floor of its own.
  dompurify: "^3.4.13"
