name: merge-gate action

# The gate is the only required status check on every repository in the org, so
# a regression here unprotects all of them at once and nothing else would notice.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: gate fails closed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: every failure mode still fails
        run: python3 actions/merge-gate/test_gate.py

  manifest:
    name: action.yml is loadable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: it parses
        run: python3 -c "import yaml,sys; yaml.safe_load(open('actions/merge-gate/action.yml'))"

  # default.json is consumed by every repository in the org, and until now
  # nothing looked at it before it shipped.
  renovate-preset:
    name: renovate preset is valid and holds its floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: the schema
        run: npx --yes --package renovate renovate-config-validator --strict default.json
      # The validator only knows the schema. It accepts `minimumReleaseAge:
      # "3 bananas"` because the schema says "string" and stops there, and it has
      # no opinion at all on whether the value agrees with the package managers
      # that consume the lockfiles Renovate writes. That agreement is the actual
      # invariant, so it gets its own check — and a self-test, because a gate
      # nobody has watched fail is not known to be a gate.
      - name: the floor, and proof the check can fail
        run: |
          python3 scripts/check-renovate-floor.py
          python3 scripts/check-renovate-floor.py --self-test

  # This job is three things at once, deliberately.
  #
  # It is this repository's own required check. It is also the only place the
  # composite action is *invoked* rather than merely read — the first release
  # shipped an action.yml that could not load at all (a ${{ }} expression in an
  # input description, which Actions evaluates at manifest load) and CI was green,
  # because it ran the Python and never used the action. The defect surfaced in
  # the first consumer instead. A test that exercises the script but not the
  # artifact consumers load is not testing the thing that ships.
  #
  # The failure modes are covered exhaustively by test_gate.py against the same
  # gate.py this runs. What only a real invocation can prove is that the manifest
  # loads and the inputs are wired, which is exactly what broke.
  merge-gate:
    name: merge gate
    runs-on: ubuntu-latest
    needs: [test, manifest, renovate-preset]
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./actions/merge-gate
        with:
          needs: ${{ toJSON(needs) }}
