name: merge gate
description: >-
  The single required status check for a workflow. Fails unless every job in the
  workflow is watched by the calling job and every one of them succeeded.

inputs:
  needs:
    # No ${{ }} in any description on this file. Actions evaluates expressions
    # inside input descriptions when it loads the manifest, and `needs` is not a
    # named value in that context, so an example written there fails the whole
    # action to load — for every consumer, with an error that points here rather
    # than at their workflow. See the README for the call site.
    description: 'The calling job serialised needs context. Always toJSON(needs).'
    required: true
  gate-job-id:
    description: >-
      The calling job's own id, so the gate can exclude itself when checking that
      every job in the workflow is watched. Defaults to the convention.
    required: false
    default: merge-gate
  token:
    description: >-
      Used only to read the calling workflow file back, to check that no job in it
      is outside the gate. Needs no more than the default read scope.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - shell: bash
      env:
        NEEDS: ${{ inputs.needs }}
        GATE_JOB_ID: ${{ inputs['gate-job-id'] }}
        WORKFLOW_REF: ${{ github.workflow_ref }}
        REPO: ${{ github.repository }}
        SHA: ${{ github.sha }}
        TOKEN: ${{ inputs.token }}
      run: python3 "$GITHUB_ACTION_PATH/gate.py"
